<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="700" fill="#F5F5F5" rx="10" ry="10"/>
  
  <!-- 标题 -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1E88E5">
    Task 3: Optimal Operational Decision-Making Framework
  </text>
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666666">
    Prediction → Decision → Optimization → Validation Closed-Loop System
  </text>

  <!-- 1. 输入模块 -->
  <rect x="50" y="150" width="200" height="120" rx="15" ry="15" fill="#1E88E5" opacity="0.9"/>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Input Module
  </text>
  <text x="150" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Contaminant Concentration (Task 2)
  </text>
  <text x="150" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Hydrological Data (Flow Velocity, etc.)
  </text>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Model Parameters (α, β, γ, k, Csafe)
  </text>

  <!-- 2. 核心模块1：加权多目标成本函数 -->
  <rect x="350" y="120" width="250" height="180" rx="15" ry="15" fill="#FF9800" opacity="0.9"/>
  <text x="475" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Weighted Multi-Objective Cost Function
  </text>
  <text x="475" y="175" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    min Total Cost = α·Cshutdown + β·Csupply + γ·Crisk
  </text>
  <!-- 子成本 -->
  <rect x="360" y="190" width="70" height="60" rx="8" ry="8" fill="#FFB74D" opacity="0.9"/>
  <text x="395" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
    Shutdown Cost
  </text>
  <text x="395" y="235" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
    ΣCs·U(t)
  </text>

  <rect x="440" y="190" width="70" height="60" rx="8" ry="8" fill="#FFB74D" opacity="0.9"/>
  <text x="475" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
    Supply Loss Cost
  </text>
  <text x="475" y="235" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
    ΣCl·max(...)
  </text>

  <rect x="520" y="190" width="70" height="60" rx="8" ry="8" fill="#FFB74D" opacity="0.9"/>
  <text x="555" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
    Risk Cost
  </text>
  <text x="555" y="235" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
    Σk·max(...)·Q(t)
  </text>
  <text x="475" y="275" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    α=0.35, β=0.25, γ=0.40 (Public Health First)
  </text>

  <!-- 3. 核心模块2：动态规划算法 -->
  <rect x="700" y="120" width="250" height="180" rx="15" ry="15" fill="#9C27B0" opacity="0.9"/>
  <text x="825" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Dynamic Programming Algorithm
  </text>
  <text x="825" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    State Definition: V(t, C(t), S(t), U(t-1))
  </text>
  <text x="825" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    State Transition: V(t) = min[Instant Cost + V(t+1)]
  </text>
  <text x="825" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Boundary Condition: V(24) = 0
  </text>
  <text x="825" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Constraints: Storage Balance, Concentration Limit
  </text>
  <text x="825" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Bellman's Principle | Markov Property
  </text>

  <!-- 4. 输出模块 -->
  <rect x="350" y="350" width="250" height="120" rx="15" ry="15" fill="#4CAF50" opacity="0.9"/>
  <text x="475" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Output Module
  </text>
  <text x="475" y="405" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Optimal 24h Shutdown/Operation Schedule
  </text>
  <text x="475" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Key Indicators: Cost, Shutdown Duration, Risk
  </text>
  <text x="475" y="445" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Supply Loss Rate = 0% (Emergency Storage)
  </text>

  <!-- 5. 验证模块 -->
  <ellipse cx="700" cy="410" rx="125" ry="60" fill="#1E88E5" opacity="0.9"/>
  <text x="700" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Validation Module
  </text>
  <text x="700" y="415" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Sensitivity & Robustness Analysis
  </text>
  <text x="700" y="435" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Uncertainty Verification
  </text>

  <!-- 流程箭头（渐变蓝） -->
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 输入→核心1 -->
  <path d="M 250 210 Q 300 210 350 210" stroke="url(#arrowGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <!-- 核心1→核心2 -->
  <path d="M 600 210 Q 650 210 700 210" stroke="url(#arrowGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <!-- 核心2→输出 -->
  <path d="M 825 300 Q 650 350 475 350" stroke="url(#arrowGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <!-- 输出→验证 -->
  <path d="M 600 410 Q 650 410 700 410" stroke="url(#arrowGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <!-- 验证→核心1（闭环反馈） -->
  <path d="M 700 470 Q 550 450 475 300" stroke="url(#arrowGrad)" stroke-width="3" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="580" y="460" font-family="Arial, sans-serif" font-size="10" fill="#1E88E5" text-anchor="middle">
    Closed-Loop Feedback (Parameter Adjustment)
  </text>

  <!-- 箭头标记 -->
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="url(#arrowGrad)"/>
  </marker>

  <!-- 水厂装饰图标（右侧） -->
  <path d="M 1000 150 L 1000 250 L 1050 250 L 1050 200 L 1080 200 L 1080 250 L 1130 250 L 1130 150 Z" fill="#1E88E5" opacity="0.7"/>
  <rect x="1020" y="170" width="40" height="20" fill="#64B5F6" rx="3" ry="3"/>
  <text x="1040" y="185" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">WTP</text>
  <circle cx="1040" cy="220" r="10" fill="#4CAF50"/>

  <!-- 水流装饰图标（底部） -->
  <path d="M 50 550 Q 150 530 250 550 T 450 550 T 650 550 T 850 550 T 1050 550" stroke="#64B5F6" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 50 570 Q 150 550 250 570 T 450 570 T 650 570 T 850 570 T 1050 570" stroke="#64B5F6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 50 590 Q 150 570 250 590 T 450 590 T 650 590 T 850 590 T 1050 590" stroke="#64B5F6" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
